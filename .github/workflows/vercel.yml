name: Deploy Vercel API

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Split out so the run says which of the two things is wrong: credentials
      # that were never set, or credentials Vercel rejects.
      - name: Check the Vercel credentials are set
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          echo "VERCEL_TOKEN set:      $HAS_TOKEN"
          echo "VERCEL_ORG_ID set:     $HAS_ORG"
          echo "VERCEL_PROJECT_ID set: $HAS_PROJECT"
          if [ "$HAS_TOKEN$HAS_ORG$HAS_PROJECT" != "truetruetrue" ]; then
            echo "::error::Missing Vercel secrets. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID under Settings -> Secrets and variables -> Actions, or connect the Vercel project to this repo in the Vercel dashboard and delete this workflow."
            exit 1
          fi

      # `continue-on-error: true` used to be set here, so a failed deploy still
      # reported a green tick while the live site kept serving an old
      # index.html. A broken deploy must be visible.
      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      # The deploy step can "succeed" without the production alias moving, so
      # the answer to "is my change live?" is checked directly: Vercel's ETag
      # for a static file is the md5 of that file.
      - name: Verify the live site serves this commit
        run: |
          want=$(md5sum index.html | cut -d' ' -f1)
          for i in $(seq 1 20); do
            got=$(curl -fsS "https://ipo-allotment-checker-two.vercel.app/?ci=${GITHUB_SHA}" | md5sum | cut -d' ' -f1)
            if [ "$want" = "$got" ]; then
              echo "live site is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt $i: live=$got want=$want"
            sleep 15
          done
          echo "::error::ipo-allotment-checker-two.vercel.app is still serving a different index.html (live=$got want=$want). Check the Vercel project and the VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets."
          exit 1
