name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  schedule:
    # Refresh MUFG IPO list every hour on the IST hour mark (IST = UTC+5:30 → :30 UTC)
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p public
          cp index.html public/
          python3 scripts/fetch_ipos.py public/ipos.json
          touch public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
