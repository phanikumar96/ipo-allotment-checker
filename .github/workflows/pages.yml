name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          exclude: |
            .git
            .github
            __pycache__
            api/__pycache__
            .DS_Store
            mufg_proxy_server_v2.py
            IPO_Allotment_MUFG_Proxy_Fixed_v2.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
